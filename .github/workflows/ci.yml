name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install beebasm
        run: |
          git clone --depth 1 https://github.com/stardot/beebasm.git /tmp/beebasm
          cd /tmp/beebasm/src
          make code
          sudo cp /tmp/beebasm/beebasm /usr/local/bin/
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: |
            build.rom
            build.labels
          if-no-files-found: error

  publish:
    name: Publish ROM to the build branch
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-build-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rom
          path: ${{ runner.temp }}/rom
      - name: Commit the ROM to the build branch if it changed
        env:
          ROM_DIR: ${{ runner.temp }}/rom
        run: |
          if git fetch --depth 1 origin build; then
            git checkout -B build FETCH_HEAD
          else
            git checkout --orphan build
            git rm -rfq .
          fi
          cp "$ROM_DIR/build.rom" xmos.rom
          cp "$ROM_DIR/build.labels" xmos.labels
          cat > README.md <<EOF
          # XMOS build

          Generated by CI from each push to main of
          [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY}) that
          passes its tests; don't edit it by hand. Each commit message names the
          source commit it was built from.

          - \`xmos.rom\`: the 16KB sideways ROM
          - \`xmos.labels\`: beebasm's labels for it
          EOF
          git add xmos.rom xmos.labels README.md
          if git diff --cached --quiet; then
            echo "The build is unchanged, so there is nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build of ${GITHUB_SHA}"
          git push origin build
